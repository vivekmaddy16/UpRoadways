<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>यूपी रोडवेज — Bus Driver ki Playlist</title>
  <meta name="description" content="यूपी रोडवेज — Bus Driver ki Playlist. Nostalgic 90s bangers that play on UP Roadways buses.">
  
  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
  
  <!-- Firebase SDK for Real-time Passenger Auto-Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dual-Tone Background Gradient Container -->
  <div class="bg-container"></div>

  <!-- Main Viewport Grid -->
  <div class="app-viewport">

    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <!-- Left: Clock -->
      <div class="clock-display" id="clock-display">3:03 pm</div>

      <!-- Center: Status Badge -->
      <div class="highway-badge">
        <span class="pulse-dot"></span>
        <span id="live-count" style="font-weight: 700;">online</span>
      </div>

      <!-- Right: Spotify + YouTube Music Buttons -->
      <div class="top-right-btns">
        <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" class="top-right-btn spotify-btn" title="Listen on Spotify">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          <span>Spotify</span>
        </a>
        <a href="https://music.youtube.com/playlist?list=PLeatb7hupNV_AWUl_7ttbsKeCQh8tF5N4" target="_blank" rel="noopener noreferrer" class="top-right-btn ytmusic-btn" title="Bus Driver ki Playlist on YouTube Music">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
          <span>YT Music</span>
        </a>
      </div>
    </header>

    <!-- Main Center Hero Section -->
    <main class="hero-stage">
      <!-- Title in Devanagari Hindi -->
      <h1 class="hero-title-hindi">यूपी रोडवेज</h1>

      <!-- English Subtitle -->
      <p class="hero-subtitle-eng">BUS DRIVER KI PLAYLIST &nbsp;|&nbsp; SINCE 90's</p>

      <!-- Highway Shayari Subtitle -->
      <p class="hero-quote">
        धीरे चलोगे तो बार-बार मिलोगे, तेज चलोगे तो हरिद्वार मिलोगे। <span class="hero-quote-icon">↩</span>
      </p>
    </main>

    <!-- Left Floating Horn OK Please Button -->
    <div class="horn-btn-container">
      <button class="horn-pill-btn" id="btn-horn" title="Play Bus Horn Sound">
        <div class="horn-icon-circle">🔊</div>
        <div class="horn-text-group">
          <span class="horn-text-hindi">हॉर्न ओके प्लीज</span>
          <span class="horn-text-eng">Horn ok pleaseeee</span>
        </div>
      </button>
    </div>

    <!-- Bottom Floating Audio Player Pill -->
    <div class="player-container">
      <div class="player-card">
        
        <!-- Track Thumbnail -->
        <img src="assets/up_bus_cover.png" alt="Song Artwork" class="player-thumb-img" id="player-cover">

        <!-- Track Metadata & Seeker -->
        <div class="player-main-info">
          <div class="player-song-title" id="player-title">Saaton Janam Main Tere</div>
          <div class="player-song-artist" id="player-artist">Kumar Sanu & Alka Yagnik</div>
          
          <div class="player-progress-bar" id="progress-container">
            <div class="player-progress-fill" id="progress-fill"></div>
          </div>
          
          <div class="player-time-text">
            <span id="time-current">0:00</span> / <span id="time-duration">6:02</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
          <!-- Shuffle Button -->
          <button class="ctrl-icon-btn" id="btn-shuffle" title="Shuffle Playlist">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <!-- Prev Button -->
          <button class="ctrl-icon-btn" id="btn-prev" title="Previous Song">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <!-- Main Play/Pause Button -->
          <button class="ctrl-icon-btn btn-play-primary" id="btn-play" title="Play/Pause">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- Next Button -->
          <button class="ctrl-icon-btn" id="btn-next" title="Next Song">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Contact Footer -->
    <div class="contact-footer">
      contact: kumarsinghu0@gmail.com
    </div>

  </div>

  <!-- HTML5 Audio Engine -->
  <audio id="audio-engine" preload="auto" crossorigin="anonymous"></audio>

  <!-- YouTube IFrame API Container for Real Track Audio -->
  <div id="yt-player" style="position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
